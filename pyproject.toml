[project]
name = "bugforge-env"
version = "0.1.0"
description = "Procedurally generated bug-repair environments for LLM agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pytest>=7"]

[project.optional-dependencies]
dev = ["ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "tasks/base"]

[tool.ruff]
line-length = 100
extend-exclude = ["tasks"]
